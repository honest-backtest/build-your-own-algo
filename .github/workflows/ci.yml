name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Secret and identifier scan
        run: python tools/scan_secrets.py
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest -q
      - name: Chapter scripts run
        run: |
          for f in chapters/ch*/run.py; do echo "== $f"; python "$f"; done
